version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # vue-tsc resolves typescript/lib/tsc, which TypeScript 7 no longer exports.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      frontend:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep the runtime on Python 3.14 until CI and local tooling move to
      # the next interpreter together. Patch/base-image updates are still allowed.
      - dependency-name: "python"
        versions: [">=3.15"]
    groups:
      backend-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-images:
        patterns:
          - "*"
