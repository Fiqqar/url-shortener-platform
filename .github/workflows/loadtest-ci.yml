name: loadtest-ci

on:
  push:
    branches: [main]
    paths:
      - 'loadtest/**'
      - '.github/workflows/loadtest-ci.yml'
  pull_request:
    paths:
      - 'loadtest/**'
      - '.github/workflows/loadtest-ci.yml'

permissions:
  contents: read

concurrency:
  group: loadtest-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loadtest:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            loadtest/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r loadtest/requirements.txt

      - name: Start backend
        working-directory: backend
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python -m uvicorn app.main:app --port 8000 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
          curl -sf http://localhost:8000/ready

      - name: Locust smoke test
        env:
          LOCUST_HOST: http://localhost:8000
        run: locust -f loadtest/locustfile.py --headless -u 2 -r 2 -t 30s --host http://localhost:8000

      - name: Stop backend
        if: always()
        run: kill $(cat /tmp/backend.pid) || true
