name: terraform-ci

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-ci.yml'
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-ci.yml'

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ubuntu runners expose Docker over a unix socket, unlike the
  # Windows npipe default in variables.tf.
  TF_VAR_docker_host: unix:///var/run/docker.sock

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Build images required by plan
        run: |
          docker build --pull -t url-shortener-backend:dev ../../backend
          docker build --pull -t url-shortener-frontend:dev ../../frontend

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan
